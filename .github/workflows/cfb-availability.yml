name: College availability

# College availability (cfbmodel/availability_log.py). Two things:
# 1. docs/cfb/availability.json, the board's live input (from Nov 9, 2026): each power-conference
#    team's newest official availability report while its game is still ahead (SEC, ACC, Big 12,
#    Big Ten; one vendor app serves all four: app.hdintelligence.com, public JSON). The board build
#    (cfbmodel/designations.py) uses these over the Covers.com designations for every team that has one.
# 2. History, data/cfb/availability/<season>/: conf_log.csv and conf_archive.json (every report
#    version); covers_log.csv, every change in the Covers.com designations (docs/cfb/designations.json,
#    written daily by the Claude task); and ESPN's college injury feed in log.csv, which was empty on
#    the Nov 3, 2026 dry runs and is kept in case it fills.
# About 2,000-4,000 ESPN calls a run, two to three minutes. In season: every two hours Wednesday to
# Friday, hourly on Saturday (reports land from three days out, the final one 90 minutes to two hours
# before kickoff), once on the other days.

on:
  schedule:
    - cron: "7 0,2,4,12,14,16,18,20,22 * 8-12,1 3-5"   # Wed-Fri (UTC), every two hours
    - cron: "7 * * 8-12,1 6"                             # Saturday (UTC), hourly
    - cron: "7 0-6 * 8-12,1 0"                           # Saturday night ET, hourly, into Sunday UTC
    - cron: "7 16 * 8-12,1 0-2"                          # Sun-Tue, once
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the changes, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Conference reports (SEC, ACC, Big 12, Big Ten via the vendor app)
        continue-on-error: true
        run: |
          args="--conferences"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m cfbmodel.availability_log $args
      - name: Log the Covers designations the board used
        run: |
          args="--covers"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m cfbmodel.availability_log $args
      - name: ESPN (empty for college as of Nov 2026; kept for when it fills, never fails the run)
        continue-on-error: true
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="--dry-run"
          python -m cfbmodel.availability_log $args
      - name: Commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cfb/availability docs/cfb/availability.json
          # docs/cfb/availability.json alone, with only its fetched time changed, is no change
          if [ "$(git diff --cached --name-only)" = "docs/cfb/availability.json" ] && \
             [ "$(git diff --cached -U0 docs/cfb/availability.json | grep -c '^[-+] *"fetched"')" = "2" ] && \
             [ "$(git diff --cached --numstat docs/cfb/availability.json | cut -f1)" = "1" ]; then
            git reset -q; echo "no change (timestamp only)"; exit 0
          fi
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "College availability $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
