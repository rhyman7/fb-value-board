name: College availability

# College availability history (cfbmodel/availability_log.py), data/cfb/availability/<season>/:
# conf_log.csv and conf_archive.json, the four power conferences' own availability reports (one
# vendor app serves all four: app.hdintelligence.com, public JSON); covers_log.csv, every change in the Covers.com designations the board uses (docs/cfb/designations.json,
# written daily by the Claude task); and ESPN's college injury feed in log.csv, which was empty on the
# Nov 3, 2026 dry runs and is kept in case it fills. Reading the conference report pages directly
# (SEC, Big Ten, ACC, Big 12) is the next step.
# History only: the board's Covers.com designations are untouched until the kickoff-time
# availability has been tested against the 2026 live prop log. About 2,000-4,000 ESPN calls a run,
# two to three minutes. In season: every two hours Wednesday to Friday, hourly on Saturday
# (reports land from three days out, the final one 90 minutes to two hours before kickoff), once
# on the other days.

on:
  schedule:
    - cron: "7 0,2,4,12,14,16,18,20,22 * 8-12,1 3-5"   # Wed-Fri (UTC), every two hours
    - cron: "7 * * 8-12,1 6"                             # Saturday (UTC), hourly
    - cron: "7 0-6 * 8-12,1 0"                           # Saturday night ET, hourly, into Sunday UTC
    - cron: "7 16 * 8-12,1 0-2"                          # Sun-Tue, once
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the changes, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Conference reports (SEC, ACC, Big 12, Big Ten via the vendor app)
        continue-on-error: true
        run: |
          args="--conferences"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m cfbmodel.availability_log $args
      - name: Log the Covers designations the board used
        run: |
          args="--covers"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m cfbmodel.availability_log $args
      - name: ESPN (empty for college as of Nov 2026; kept for when it fills, never fails the run)
        continue-on-error: true
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="--dry-run"
          python -m cfbmodel.availability_log $args
      - name: Commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cfb/availability
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "College availability $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
