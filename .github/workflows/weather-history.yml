name: Weather history

# Rain, snow and temperature during every played outdoor NFL home game since 2014, from
# Open-Meteo's free history archive, for experiments/precip_test.py. Run by hand only, from
# main. Same calls as the Wind history Action (one per stadium per season, a few minutes; a
# failed call is retried next run). No Odds API credits.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Most archive calls this run (blank for all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        timeout-minutes: 45
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python experiments/fetch_weather_history.py --limit "${{ inputs.limit }}"
          else
            python experiments/fetch_weather_history.py
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/weather_history.csv
          git diff --cached --quiet || git commit -m "Weather history: archive rain, snow and temperature"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
