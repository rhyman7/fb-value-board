name: College props probe

# How many college games have DraftKings / FanDuel player props this week, and which markets
# (experiments/cfb_props_probe.py). Run by hand, Thursday or Friday: one credit per game that has
# passing-yard props posted, plus at most 13 each for two games' full market list. Capped by
# max_credits. Writes experiments/out/cfb_props_probe.json.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Games kicking off in the next N days"
        default: "4"
      max_credits:
        description: "Most credits this run may spend"
        default: "120"
      past:
        description: "A past Saturday, YYYY-MM-DD, to check the archive instead (10x cost; use max_credits 700)"
        default: ""

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main: from ${{ github.ref }} its files could not be committed."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          args=(--days "${{ inputs.days }}" --max-credits "${{ inputs.max_credits }}")
          [ -n "${{ inputs.past }}" ] && args+=(--past "${{ inputs.past }}")
          python experiments/cfb_props_probe.py "${args[@]}"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/out/cfb_props_probe*.json data/props/api_usage.csv
          git diff --cached --quiet || git commit -m "College props probe"
          # The usage log is append-only and another Action may have added rows since this
          # run checked out: on a conflict there, keep both sides' rows.
          if ! git pull --rebase origin main; then
            # during the rebase HEAD is origin/main and REBASE_HEAD is this run's commit
            git show HEAD:data/props/api_usage.csv > /tmp/usage.csv
            git show REBASE_HEAD:data/props/api_usage.csv | tail -n +2 >> /tmp/usage.csv
            awk '!seen[$0]++' /tmp/usage.csv > data/props/api_usage.csv
            git add data/props/api_usage.csv
            git diff --name-only --diff-filter=U | grep -q . && { echo "unexpected conflict outside the usage log"; exit 1; }
            GIT_EDITOR=true git rebase --continue
          fi
          git push
