name: Update board

on:
  schedule:
    - cron: "17 11 * 9-12,1-2 *"   # daily at 11:17 UTC, September to February
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the full backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: board-commits      # shared with the college board, so the two never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # PFF route share for the New projections (nflmodel/pff_routes.py), the PFF-grade
      # quarterback prior for the game model (nflmodel/pff_qb.py) and, from Nov 13, 2026, the
      # passing grade and opponent coverage in the passing-yards projection (nflmodel/pff_passing.py,
      # passing summary and team overview). Private data: checked out into
      # .pff-data/ (git-ignored, never added below). Without the PFF_DATA_TOKEN secret, or if the
      # checkout fails, the board builds without them, as before Nov 5, 2026 (QB prior -0.13).
      - name: PFF data (private)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: rhyman7/pff-data
          token: ${{ secrets.PFF_DATA_TOKEN }}
          path: .pff-data
          sparse-checkout: |
            nfl/**/*_receiving_summary.csv.gz
            nfl/**/*_passing_summary.csv.gz
            nfl/**/*_team_overview.csv.gz
          sparse-checkout-cone-mode: false
      - name: Browser for the best-bets PDF
        # never fails the build: the PDF step skips itself without a browser (scripts/build_pdf.py).
        # On Nov 11, 2026 the system-package half of --with-deps could not reach Ubuntu's mirrors and
        # failed every board run for hours; the runner image already has what Chromium needs.
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Build the board
        run: |
          # Full backtest on the scheduled Tuesday run (after Monday night) or when asked; otherwise
          # the quick refresh (rebuilds started by other Actions on a Tuesday, e.g. the Kickoff
          # refresh before Monday night, stay quick).
          if { [ "$(date -u +%u)" = "2" ] && [ "${{ github.event_name }}" = "schedule" ]; } || [ "${{ inputs.backtest }}" = "true" ]; then
            python run.py
          else
            python run.py --no-backtest
          fi
      - name: Best-bets PDF
        run: python scripts/build_pdf.py nfl
      - run: python -m pytest -q
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/cache data/line_history.csv
          if [ -f data/wind_log.csv ]; then git add data/wind_log.csv; fi
          for f in data/ledger.csv data/ledger_results.csv data/ledger_status.csv data/bestbets.csv data/bestbets_results.csv; do if [ -f "$f" ]; then git add "$f"; fi; done   # the bet ledger (nflmodel/ledger.py)
          if [ -d data/shadow ]; then git add data/shadow; fi   # shadow test log (nflmodel/shadow.py)
          if [ -d data/parlays ]; then git add data/parlays; fi   # the Parlays page record (nflmodel/parlaylog.py)
          if [ -d data/teasers ]; then git add data/teasers; fi   # Wong underdog teaser live record (nflmodel/teaserlog.py)
          if [ -d data/forecast_log ]; then git add data/forecast_log; fi   # every forecast shown before kickoff (nflmodel/forecastlog.py)
          if [ -d data/ol_watch ]; then git add data/ol_watch; fi   # teams missing 2+ usual linemen, a paper record (nflmodel/olwatch.py)
          git diff --cached --quiet || git commit -m "Update board"
          git pull --rebase origin main
          git push
