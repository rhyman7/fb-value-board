name: Update board

on:
  schedule:
    - cron: "17 11 * 9-12,1-2 *"   # daily at 11:17 UTC, September to February
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the full backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: board-commits      # shared with the college board, so the two never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for the best-bets PDF
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Build the board
        run: |
          # Full backtest on Tuesdays (after Monday night) or when asked; otherwise the quick refresh.
          if [ "$(date -u +%u)" = "2" ] || [ "${{ inputs.backtest }}" = "true" ]; then
            python run.py
          else
            python run.py --no-backtest
          fi
      - name: Best-bets PDF
        run: python scripts/build_pdf.py nfl
      - run: python -m pytest -q
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/cache data/line_history.csv
          if [ -f data/wind_log.csv ]; then git add data/wind_log.csv; fi
          for f in data/ledger.csv data/ledger_results.csv; do if [ -f "$f" ]; then git add "$f"; fi; done   # the bet ledger (nflmodel/ledger.py)
          if [ -d data/shadow ]; then git add data/shadow; fi   # shadow test log (nflmodel/shadow.py)
          git diff --cached --quiet || git commit -m "Update board"
          git pull --rebase origin main
          git push
