name: Forecast history

# The rain and snow FORECAST for every played outdoor NFL home game since 2022, from
# Open-Meteo's forecast archives (game-morning forecasts from 2022; 1, 2 and 3 days ahead from
# 2024), for experiments/rain_forecast_backtest.py. Run by hand only, from main. Up to two
# calls per stadium per season, a few minutes; a failed stadium-season is retried next run.
# No Odds API credits.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Most archive calls this run (blank for all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        timeout-minutes: 45
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python experiments/fetch_forecast_history.py --limit "${{ inputs.limit }}"
          else
            python experiments/fetch_forecast_history.py
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/forecast_history.csv
          git diff --cached --quiet || git commit -m "Forecast history: archived rain and snow forecasts"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
