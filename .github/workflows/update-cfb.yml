name: Update college board

on:
  schedule:
    - cron: "43 12 * 8-12,1 *"      # daily at 12:43 UTC (8:43 a.m. Eastern), August to January
    - cron: "43 16,20 * 8-12,1 6"   # Saturdays also at 12:43 and 4:43 p.m. Eastern, closer to kickoffs
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the full backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # PFF route/snap share for the receiving projections (cfbmodel/pff_roles.py) and the
      # transfer-aware returning production in the margin model (cfbmodel/pff_returning.py, offense
      # and defense summaries). Private data: checked out into .pff-data/ (git-ignored, never added
      # below). Without the PFF_DATA_TOKEN secret, or if the checkout fails, the board builds without
      # them, as before Nov 4, 2026 (d_pffret = 0).
      - name: PFF data (private)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: rhyman7/pff-data
          token: ${{ secrets.PFF_DATA_TOKEN }}
          path: .pff-data
          sparse-checkout: |
            ncaa/**/*_receiving_summary.csv.gz
            ncaa/**/*_offense_summary.csv.gz
            ncaa/**/*_defense_summary.csv.gz
          sparse-checkout-cone-mode: false
      - name: Browser for the best-bets PDF
        # never fails the build: the PDF step skips itself without a browser (scripts/build_pdf.py).
        # On Nov 11, 2026 the system-package half of --with-deps could not reach Ubuntu's mirrors and
        # failed every board run for hours; the runner image already has what Chromium needs.
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Build the college board
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}   # optional: CollegeFootballData lines for games ESPN has not priced
        run: |
          # Full backtest on Mondays (Saturday's box scores are in by then) or when asked.
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "12" ] || [ "${{ inputs.backtest }}" = "true" ]; then
            python run_cfb.py
          else
            python run_cfb.py --no-backtest
          fi
      - name: College props page
        # the Props section (nflmodel/cfbpropboard.py): logs lines the college prop pulls posted
        # since the last build, grades played games, writes docs/cfb/props/. Never stops the build.
        run: python -m nflmodel.cfbpropboard || echo "college props page skipped"
      - name: Best-bets PDF
        run: python scripts/build_pdf.py cfb
      - run: python -m pytest -q
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cfb data/cfb/cache data/cfb/line_history.csv
          if [ -f data/props/cfb_prop_log.csv ]; then git add data/props/cfb_prop_log.csv; fi   # the college Props log
          if [ -d docs/feed ]; then git add docs/feed; fi   # the matchup dashboards' feed (nflmodel/dashfeed.py)
          if [ -d docs/parlays ]; then git add docs/parlays docs/parlays.html; fi
          if [ -d data/parlays ]; then git add data/parlays; fi   # the Parlays page (nflmodel/parlays.py)
          if [ -d data/forecast_log ]; then git add data/forecast_log; fi   # every forecast shown before kickoff (nflmodel/forecastlog.py)
          for f in data/cfb/wind_log.csv data/cfb/backtest.json data/cfb/ledger.csv data/cfb/ledger_results.csv data/cfb/ledger_status.csv data/cfb/bestbets.csv data/cfb/bestbets_results.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Update college board"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
