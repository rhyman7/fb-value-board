name: Market lines

# Snapshots of NFL and college game lines (spreads, totals, moneylines) from Pinnacle,
# DraftKings, FanDuel, BetMGM and Kalshi through The Odds API (nflmodel/market.py), stored
# under data/market/. Three a day in season, plus hourly from Sunday night to Tuesday night
# (US time), when the week's lines open and the model's edge is largest. About 6 credits a
# snapshot, about 1,400 a month. The board builds read these files. On game days (college
# Saturdays, NFL Sundays and Thursday nights) an hourly snapshot of the league playing (3
# credits, about 360 a month) is followed by a quick rebuild of that board, started from here.
#
# After each snapshot, `run_market.py alerts` measures every side the model is off the opener
# at Pinnacle's newest line (nflmodel/sheet.line_moves): it writes docs/moves.json and
# docs/cfb/moves.json (the boards' Line movement section reads them, so it is as fresh as the
# snapshot without a rebuild), and for sides with a backtested edge that are new or whose
# status changed (Live, Partly gone, Missed) it pushes to the phone through ntfy (secret
# NTFY_TOPIC) and comments on the week's opener-alerts issue.
#
# Derivatives (team totals, first-half lines; nflmodel/derivs.py) ride the 14:05 UTC run:
# the API serves them one event at a time, so `run_market.py derivatives` spends at most
# market.DERIV_BUDGET credits a run (NFL 70, about 16 games x 4 markets; college 160, about
# 50 games x 3 markets), NFL on Thursday, Saturday and Sunday mornings US (about 900 credits
# a month) and college on Fridays (about 700): the whole workflow stays under about 3,000 a
# month of the account's 20,000 (the props use about 2,500). The "derivatives" input runs
# them by hand for both leagues.

on:
  schedule:
    - cron: "5 2,14,20 * 8-12,1-2 *"          # three a day (UTC), August to February
    - cron: "35 0-23 * 8-12,1-2 1,2"          # hourly all day Monday and Tuesday UTC
    - cron: "35 21-23 * 8-12,1-2 0"           # Sunday evening US (late Sunday UTC)
    # game days (Oct 31, 2026): hourly snapshots of the league playing, each followed by a quick
    # rebuild of that board, so the prices on the sheet are never more than about an hour old
    - cron: "50 13-23 * 8-12,1 6"             # college Saturdays, 9:50 a.m. to 7:50 p.m. Eastern
    - cron: "50 13-20 * 9-12,1-2 0"           # NFL Sundays, 9:50 a.m. to 4:50 p.m. Eastern
    - cron: "50 21,22 * 9-12,1 4"             # NFL Thursday night, before kickoff
  workflow_dispatch:
    inputs:
      derivatives:
        description: "Also fetch the derivative markets (team totals, first-half lines) for both leagues"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write      # the game-day runs start the board rebuild (workflow_dispatch)

concurrency:
  group: board-commits      # shared with the board updates and the props, so pushes never collide
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # game-day runs snapshot only the league playing (3 credits); the others both leagues (6)
          case "${{ github.event.schedule }}" in
            "50 13-23 * 8-12,1 6") python run_market.py snapshot --league cfb ;;
            "50 13-20 * 9-12,1-2 0"|"50 21,22 * 9-12,1 4") python run_market.py snapshot --league nfl ;;
            *) python run_market.py snapshot ;;
          esac
          # derivatives on the 14:05 UTC run: NFL Thursday, Saturday and Sunday; college Friday (or when asked)
          if [ "${{ inputs.derivatives }}" = "true" ]; then
            python run_market.py derivatives
          elif [ "${{ github.event.schedule }}" = "5 2,14,20 * 8-12,1-2 *" ] && [ "$(date -u +%H)" = "14" ]; then
            case "$(date -u +%u)" in
              4|6|7) python run_market.py derivatives --league nfl ;;
              5) python run_market.py derivatives --league cfb ;;
            esac
          fi
          python run_market.py status
          python run_market.py alerts --out /tmp/alerts.md --push /tmp/push.txt
      - name: Push line-movement alerts to the phone
        # ntfy (https://ntfy.sh): install the ntfy app, subscribe to the topic named in the
        # NTFY_TOPIC repository secret, and every new or changed gap arrives as a push. Skipped
        # when the secret is not set; the issue comment below (which mentions the owner) still goes.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -s /tmp/push.txt ] || { echo "no alerts"; exit 0; }
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set: no push"; exit 0; fi
          title=$(head -n 1 /tmp/push.txt)
          tail -n +2 /tmp/push.txt | head -c 3800 > /tmp/push_body.txt
          curl -sS --fail -H "Title: $title" -H "Tags: football" -H "Click: https://rhyman7.github.io/fb-value-board/docs/#moves-sec" \
            --data-binary @/tmp/push_body.txt "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || echo "push failed"
      - name: Post line-movement alerts
        # (hashFiles() only sees the workspace, so the old `if: hashFiles('/tmp/alerts.md')` never ran)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/alerts.md ] || { echo "no alerts"; exit 0; }
          # one open issue carries the week's alerts; a new one is opened when none is open
          n=$(gh issue list --label opener-alerts --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh label create opener-alerts --color FBCA04 --description "Line movement against the model's opener gaps" 2>/dev/null || true
            gh issue create --title "Line movement alerts, week of $(date -u +%Y-%m-%d)" --label opener-alerts --body-file /tmp/alerts.md
          else
            gh issue comment "$n" --body-file /tmp/alerts.md
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market data/props/api_usage.csv $(ls docs/moves.json docs/cfb/moves.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Market lines snapshot"
          git pull --rebase origin main
          git push
      - name: Rebuild the board on game days
        # a quick (no-backtest) rebuild of the board whose games are on, from the snapshot just
        # committed. The Update Actions spend no Odds API credits. Dispatching a workflow is one
        # of the events a workflow's own token may start.
        if: github.event.schedule == '50 13-23 * 8-12,1 6' || github.event.schedule == '50 13-20 * 9-12,1-2 0' || github.event.schedule == '50 21,22 * 9-12,1 4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event.schedule }}" in
            "50 13-23 * 8-12,1 6") wf=update-cfb.yml ;;
            *) wf=update.yml ;;
          esac
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/$wf/dispatches" -f ref=main
