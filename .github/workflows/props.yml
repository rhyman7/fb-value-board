name: Player props

# Prices NFL player props from The Odds API (DraftKings and FanDuel), logs every side, and
# grades finished games. The daily run grades, then takes each game's opening snapshot (once
# props are posted) and its pricing snapshot (first run within three days of kickoff, where
# bets are decided). The runs around kickoff take every game's closing prices: every ten
# minutes in the kickoff windows, and the first run inside 90 minutes of a game's kickoff
# takes its snapshot (GitHub often starts scheduled runs an hour or more late, so the window
# is wide and the runs frequent). Ten markets plus the three yardage ladders: about 585
# credits a week. See PROPS.md.

on:
  schedule:
    - cron: "47 12 * 9-12,1-2 *"          # daily, after Update board (11:17 UTC)
    - cron: "*/10 12-23 * 9-12,1-2 0"     # Sundays: London, early, late afternoon games
    - cron: "*/10 0-1 * 9-12,1-2 1"       # Sunday night (Monday UTC)
    - cron: "*/10 22-23 * 9-12,1-2 1,4"   # Monday and Thursday night
    - cron: "*/10 0-1 * 9-12,1-2 2,5"
    - cron: "*/10 16-23 * 12,1 6"         # Saturdays late in the season
    - cron: "*/10 0-1 * 12,1 0"
  workflow_dispatch:
    inputs:
      command:
        description: "flag, close, grade or all"
        type: choice
        options: [all, flag, close, grade]
        default: all

permissions:
  contents: write

concurrency:
  group: board-commits      # shared with the board updates, so the pushes never collide
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "${{ inputs.command }}" ]; then
            python run_props.py "${{ inputs.command }}"
          elif [ "${{ github.event.schedule }}" = "47 12 * 9-12,1-2 *" ]; then
            python run_props.py all
          else
            python run_props.py close
          fi
      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/props docs/props
          if [ -d docs/parlays ]; then git add docs/parlays; fi   # the Parlays page legs (nflmodel/parlays.py)
          git diff --cached --quiet || git commit -m "Update prop log"
          git pull --rebase origin main
          git push
