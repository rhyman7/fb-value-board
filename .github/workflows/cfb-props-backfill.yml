name: College prop backfill

# Past DraftKings and FanDuel college player props from The Odds API's archive
# (nflmodel/cfbpropbackfill.py), for grading the college board's prop projections against real
# lines. Run by hand only. One snapshot per game, ten minutes before kickoff, newest weeks first.
# Cost: 2 credits a week for the event lists, then 10 per market returned (nothing for a game
# with no props): about 2,200 a week with all eight markets (Nov 1, 2026 probe: 27 of 43 games on
# a 2025 Saturday had props). Ryan approved up to 32,000 for the 2025 season on Nov 1, 2026.
# A stopped run picks up where it left off when started again as a NEW run (not Re-run).

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (2023 or later)"
        default: "2025"
      max_credits:
        description: "Most credits this run may spend"
        default: "32000"

permissions:
  contents: write

concurrency:
  group: board-commits
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main: from ${{ github.ref }} its files could not be committed."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nflmodel.cfbpropbackfill --season "${{ inputs.season }}" --max-credits "${{ inputs.max_credits }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/props/history_cfb data/props/api_usage.csv
          git diff --cached --quiet || git commit -m "College prop backfill ${{ inputs.season }}"
          # The usage log is append-only and another Action may have added rows since this
          # run checked out: on a conflict there, keep both sides' rows.
          if ! git pull --rebase origin main; then
            # during the rebase HEAD is origin/main and REBASE_HEAD is this run's commit
            git show HEAD:data/props/api_usage.csv > /tmp/usage.csv
            git show REBASE_HEAD:data/props/api_usage.csv | tail -n +2 >> /tmp/usage.csv
            awk '!seen[$0]++' /tmp/usage.csv > data/props/api_usage.csv
            git add data/props/api_usage.csv
            git diff --name-only --diff-filter=U | grep -q . && { echo "unexpected conflict outside the usage log"; exit 1; }
            GIT_EDITOR=true git rebase --continue
          fi
          git push
