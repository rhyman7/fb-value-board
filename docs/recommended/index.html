<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<title>Recommended · Weekly Gridiron Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* The Recommended page and its weekly reports (nflmodel/recommended.py writes nfl.js and cfb.js).
   Hand-made, not generated by a build. Light only, like the approved mockup (Nov 20, 2026). */
:root {
  --page: #131416; --surface: #1b1d21; --raised: #24272c; --ink: #f2f1ee; --ink-2: #9da2ab;
  --grid: #2a2e35; --axis: #4a505a; --rule: #353a42; --turf: #f2f1ee; --chalk: #131416;
  --flag: #fbbf24; --flag-ink: #241d00; --link: #f2f1ee;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --sans: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1180px; margin-inline: auto; padding: 0 var(--gutter) 72px; display: grid; gap: 56px; }
header.top { display: grid; gap: 14px; padding-top: 40px; }
h1 { font: 800 clamp(36px, 10.5vw, 112px)/0.86 var(--display); letter-spacing: 0.005em; overflow-wrap: anywhere; }
h2 { font: 800 34px/1 var(--display); letter-spacing: 0.01em; }
h3 { font-size: 16px; line-height: 1.3; font-weight: 700; }
.lede { font-size: 18px; line-height: 1.45; max-width: 62ch; color: var(--ink-2); }
.lede strong, .note strong { color: var(--ink); font-weight: 700; }
.note { font-size: 13.5px; line-height: 1.5; color: var(--ink-2); max-width: 76ch; }
section { display: grid; gap: 18px; min-width: 0; }
.tiles { display: flex; flex-wrap: wrap; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.tile { flex: 1 1 200px; padding: 14px 20px 16px 0; display: grid; gap: 2px; align-content: start; }
.tile + .tile { padding-left: 20px; border-left: 1px solid var(--rule); }
.tile .label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.tile .value { font: 800 44px/1 var(--display); letter-spacing: 0.005em; white-space: nowrap; }
.tile .sub { font-size: 13px; color: var(--ink-2); }
@media (max-width: 520px) { .tile + .tile { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; border-bottom: 2px solid var(--ink); vertical-align: bottom; }
th.l, td.l { text-align: left; }
td.t { white-space: normal; min-width: 220px; max-width: 300px; }
td.w { white-space: normal; min-width: 220px; color: var(--ink-2); font-size: 13px; line-height: 1.4; text-align: left; }
table.narrow { max-width: 860px; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 3px; font-weight: 800; font-size: 12px; letter-spacing: 0.02em; border: 1.5px solid var(--ink); }
.chip.recommended { background: var(--flag); border-color: var(--flag); color: var(--flag-ink); }
.chip.proven { background: var(--turf); border-color: var(--turf); color: var(--chalk); }
.chip.paused, .chip.held { border-style: dashed; border-color: #68756d; color: var(--ink-2); background: var(--raised); }
.res { display: inline-block; min-width: 46px; text-align: center; padding: 1px 8px; border-radius: 3px; font-weight: 800; font-size: 12px; border: 1.5px solid var(--ink); }
.res.W { background: var(--ink); color: var(--page); }
.res.open, .res.V { border-style: dashed; border-color: #555; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 16px; border: 1px solid var(--axis); border-radius: 4px; background: transparent; color: var(--ink); font: 600 13.5px/1 var(--sans); text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--page); font-weight: 800; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 24px 32px; border-top: 2px solid var(--ink); padding-top: 18px; }
.rules p { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }
.status { border-top: 2px solid var(--ink); max-width: 900px; }
.status div { display: flex; gap: 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.status span.k { flex: none; width: 128px; }
.status p { font-size: 13.5px; color: var(--ink-2); }
details summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
footer { font-size: 13px; color: var(--ink-2); }

/* the weekly report: a document, black on white */
body.report td a[title] { color: inherit; text-decoration: none; }
body.report { --page: #fff; --surface: #fff; --raised: #eee; --ink: #111; --ink-2: #333; --grid: #ddd; --axis: #999; --rule: #ccc; --turf: #111; --chalk: #fff; --link: #111; color-scheme: light; background: #fff; color: #111; font-size: 14px; line-height: 1.45; }
.doc { max-width: 880px; margin-inline: auto; padding: 28px var(--gutter) 56px; display: grid; gap: 26px; }
.doc .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.doc header { display: grid; gap: 8px; border-bottom: 2px solid #111; padding-bottom: 14px; }
.doc .kicker { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #333; }
.doc h1 { font: 800 clamp(30px, 7vw, 54px)/0.9 var(--display); }
.doc h2 { font: 800 26px/1 var(--display); }
.doc p.s { font-size: 13px; color: #333; }
.doc .tiles { border-top: 0; border-bottom: 1px solid #ccc; }
.doc .tile { flex-basis: 150px; padding: 10px 18px 12px 0; }
.doc .tile + .tile { padding-left: 18px; border-left-color: #ccc; }
.doc .tile .label, .doc .tile .sub { font-size: 12px; color: #333; }
.doc .tile .value { font-size: 34px; }
.doc .box { padding: 10px 14px; border: 1px solid #111; border-radius: 4px; font-size: 13px; }
.doc .th { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.doc .th span.rec { font-size: 12.5px; color: #333; }
.doc section { gap: 8px; }
.doc table { font-size: 13px; }
.doc th, .doc td { padding: 7px 10px 7px 0; text-align: left; white-space: normal; vertical-align: top; border-bottom-color: #ddd; }
.doc th { color: #333; font-size: 12px; border-bottom-color: #111; }
.doc td.nw { white-space: nowrap; }
.doc footer { border-top: 1px solid #ccc; padding-top: 12px; display: grid; gap: 4px; font-size: 12px; color: #333; }
/* One site (Nov 26, 2026): the page is dark like the rest of the site; headings use Archivo, condensed.
   Print and the weekly report stay black on white. */
h1, h2, .tile .value { font-stretch: 75%; }
body:not(.report) h1 { font-size: clamp(36px, 8vw, 64px); line-height: 0.95; }
/* Phones: each table row is a card. Labels are written here by column position, so a column added,
   removed or reordered in one of these four tables means updating its rules below. */
.m-more { display: none; }
@media screen and (max-width: 760px) {
  table.m-cards, table.m-cards > tbody { display: block; }
  table.m-cards > thead { display: none; }
  table.m-cards > tbody > tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; margin-top: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  table.m-cards > tbody > tr > td { display: block; min-width: 0; max-width: none; width: auto; padding: 0; border: 0; text-align: left; white-space: normal; font-size: 15px; font-weight: 700; }
  table.m-cards > tbody > tr > td::before { display: block; font-size: 12px; font-weight: 400; line-height: 1.3; color: var(--ink-2); }
  table.m-cards > tbody > tr > td:empty { display: none; }
  .m-more { display: block; margin: 10px 0 0; }
  /* open picks: the pick, the game, then book, price and status; track and time under them */
  .m-open > tbody > tr > td:nth-child(4) { order: -3; grid-column: 1 / -1; font-size: 19px; }
  .m-open > tbody > tr > td:nth-child(3) { order: -2; grid-column: 1 / -1; font-weight: 400; }
  .m-open > tbody > tr > td:nth-child(n+5) { order: -1; }
  .m-open > tbody > tr > td:nth-child(2) { grid-column: span 2; font-size: 13px; font-weight: 400; }
  .m-open > tbody > tr > td:nth-child(1) { order: 1; font-size: 13px; font-weight: 400; color: var(--ink-2); text-align: right; }
  .m-open:not(.all) > tbody > tr:nth-child(n+11), .m-graded:not(.all) > tbody > tr:nth-child(n+16) { display: none; }
  .m-open > tbody > tr > td:nth-child(5)::before { content: "Book"; }
  .m-open > tbody > tr > td:nth-child(6)::before { content: "Price"; }
  .m-open > tbody > tr > td:nth-child(7)::before { content: "Status"; }
  .m-tracks > tbody > tr > td:first-child, .m-tracks > tbody > tr > td:last-child, .m-weeks > tbody > tr > td:first-child { grid-column: 1 / -1; }
  .m-tracks > tbody > tr > td:first-child { font-size: 16px; }
  .m-tracks > tbody > tr > td:first-child span { font-weight: 400; }
  .m-tracks > tbody > tr > td:last-child { font-size: 13px; font-weight: 400; }
  .m-tracks > tbody > tr > td:nth-child(2)::before { content: "Status"; }
  .m-tracks > tbody > tr > td:nth-child(3)::before { content: "Live record"; }
  .m-tracks > tbody > tr > td:nth-child(4)::before { content: "Win rate"; }
  .m-tracks > tbody > tr > td:nth-child(5)::before { content: "$10 a pick"; }
  .m-tracks > tbody > tr > td:nth-child(6)::before { content: "Return"; }
  .m-tracks > tbody > tr > td:nth-child(7)::before { content: "Closing line value"; }
  .m-tracks > tbody > tr > td:nth-child(8)::before { content: "Picks to 100"; }
  .m-tracks > tbody > tr > td:nth-child(9)::before { content: "Before going live (not part of the record)"; }
  .m-weeks > tbody > tr > td:nth-child(2)::before { content: "Picks"; }
  .m-weeks > tbody > tr > td:nth-child(3)::before { content: "Record"; }
  .m-weeks > tbody > tr > td:nth-child(4)::before { content: "Week, $10 a pick"; }
  .m-weeks > tbody > tr > td:nth-child(5)::before { content: "Running total"; }
  .m-weeks > tbody > tr > td:nth-child(6)::before { content: "Closing line value"; }
  .m-graded > tbody > tr > td:nth-child(5) { order: -3; grid-column: 1 / -1; font-size: 17px; }
  .m-graded > tbody > tr > td:nth-child(4) { order: -2; grid-column: 1 / -1; font-weight: 400; }
  .m-graded > tbody > tr > td:nth-child(n+6) { order: -1; }
  .m-graded > tbody > tr > td:nth-child(-n+3) { font-size: 13px; font-weight: 400; }
  .m-graded > tbody > tr > td:nth-child(1)::before { content: "Published"; }
  .m-graded > tbody > tr > td:nth-child(2)::before { content: "Week"; }
  .m-graded > tbody > tr > td:nth-child(3)::before { content: "Track"; }
  .m-graded > tbody > tr > td:nth-child(6)::before { content: "Book"; }
  .m-graded > tbody > tr > td:nth-child(7)::before { content: "Price"; }
  .m-graded > tbody > tr > td:nth-child(8)::before { content: "Result"; }
  .m-graded > tbody > tr > td:nth-child(9)::before { content: "$10"; }
  .m-graded > tbody > tr > td:nth-child(10)::before { content: "Rolling total"; }
}
@media print {
  :root { --page: #fff; --surface: #fff; --raised: #eee; --ink: #111; --ink-2: #333; --grid: #ddd; --axis: #999; --rule: #ccc; --turf: #111; --chalk: #fff; --link: #111; color-scheme: light; }
  #wgb-bar, .controls { display: none !important; }
  .doc { max-width: none; padding: 0; gap: 18px; }
  .doc tr, .doc .th { break-inside: avoid; }
  .doc h2 { break-after: avoid; }
  .res.W { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<script src="/site-bar.js" data-shell="2"></script>
<script src="nfl.js"></script>
<script src="cfb.js"></script>
<main id="app"></main>
<script>
"use strict";
/* Reads window.RECOMMENDED.{nfl,cfb} (written by nflmodel/recommended.py on every board build and
   props run). Two views: the record page (no hash) and a week's report (#nfl/2026/12). */
const R = window.RECOMMENDED || {};
const LEAGUES = [["nfl", "NFL"], ["cfb", "College"]];
const NAME = { nfl: "NFL", cfb: "College" };
const STATUS = { trial: "On trial", recommended: "Recommended", proven: "Proven", paused: "Paused", held: "Stopped" };
const BOOK = { draftkings: "DraftKings", fanduel: "FanDuel", kalshi: "Kalshi (after fee)" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const minus = (s) => String(s).replace(/-/g, "−");
const money = (d) => d == null ? "" : (d < 0 ? "−$" : "+$") + Math.abs(d).toFixed(2);
const pct = (x, d = 1) => x == null ? "" : (x * 100).toFixed(d) + "%";
const spct = (x) => x == null ? "" : (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1) + "%";
const pm = (x, se) => x == null ? "Too few yet" : spct(x) + (se == null ? "" : " ± " + (se * 100).toFixed(1) + "%");
const price = (o) => o == null ? "" : minus(o > 0 ? "+" + Math.round(o) : String(Math.round(o)));
const units = (u) => u == null ? "" : (u >= 0 ? "+" : "−") + Math.abs(u).toFixed(2);
const ET = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
const ETD = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const utc = (s) => new Date(String(s).replace(" UTC", "").replace(" ", "T").replace(/Z?$/, "Z"));
const when = (s) => ET.format(utc(s)).replace(",", "").replace(" AM", " am").replace(" PM", " pm");
const picksOf = (lg) => (R[lg] && R[lg].picks) || [];
const tracksOf = (lg) => (R[lg] && R[lg].tracks) || [];
const allPicks = () => LEAGUES.flatMap(([lg]) => picksOf(lg).map((p) => ({ ...p, league: lg })));
const trackName = (lg, key) => (tracksOf(lg).find((t) => t.key === key) || {}).name || key;

/* a record from picks (the page's own totals across both leagues; a bet on two tracks counts once) */
function rec(ps) {
  const g = ps.filter((p) => !p.dup && ["W", "L", "P"].includes(p.result));
  const w = g.filter((p) => p.result === "W").length, l = g.filter((p) => p.result === "L").length;
  const u = g.map((p) => p.units || 0), n = u.length, sum = u.reduce((a, b) => a + b, 0), mean = n ? sum / n : null;
  const se = n > 1 ? Math.sqrt(u.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1) / n) : null;
  const c = g.map((p) => p.clv).filter((x) => x != null), cm = c.length ? c.reduce((a, b) => a + b, 0) / c.length : null;
  const cse = c.length > 1 ? Math.sqrt(c.reduce((a, b) => a + (b - cm) ** 2, 0) / (c.length - 1) / c.length) : null;
  return { n: ps.filter((p) => !p.dup && p.result !== "V").length, graded: n, w, l, p: n - w - l, win: w + l ? w / (w + l) : null,
           units: sum, dollars: sum * 10, roi: mean, se, clv: cm, cse };
}
const wl = (r) => r.w + "-" + r.l + (r.p ? "-" + r.p : "");
const chip = (s) => `<span class="chip ${esc(s)}">${STATUS[s] || esc(s)}</span>`;
const result = (p) => p.result ? `<span class="res ${p.result}">${{ W: "Won", L: "Lost", P: "Push", V: "Void" }[p.result]}</span>` : `<span class="res open">Open</span>`;
const tile = (label, value, sub) => `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
// cross-link (Nov 26, 2026): an open pick's game opens on its value board (the board's game id is in the pick's id)
const boardHref = (p) => { const m = !p.result && /\|(\d{4}_\d+_[^|]+)\|/.exec(p.id || ""); return m ? (/^cfb/.test(p.id) ? "../cfb/#" : "../#") + encodeURIComponent(m[1]) : ""; };
const game = (p) => (boardHref(p) ? `<a href="${boardHref(p)}" title="This game on the value board">${esc(p.label)}</a>` : esc(p.label)) + (p.game ? `<br><span style="color:var(--ink-2);font-size:12.5px">${esc(p.game)}</span>` : "");
const reportHref = (lg, s, w) => `#${lg}/${s}/${w}`;
const pdfName = (lg, s, w) => `${lg}_${s}_w${String(w).padStart(2, "0")}.pdf`;

function recordPage() {
  document.body.className = "";
  document.title = "Recommended · Weekly Gridiron Board";
  const ps = allPicks(), all = rec(ps);
  const tracks = LEAGUES.flatMap(([lg]) => tracksOf(lg).map((t) => ({ ...t, league: lg })));
  const nRec = tracks.filter((t) => t.status === "recommended" || t.status === "proven").length;
  const open = ps.filter((p) => !p.result).sort((a, b) => a.kickoff < b.kickoff ? -1 : a.kickoff > b.kickoff ? 1 : a.at < b.at ? -1 : 1);
  const weeks = LEAGUES.flatMap(([lg]) => ((R[lg] && R[lg].weeks) || []).map((w) => ({ ...w, league: lg })))
    .sort((a, b) => b.season - a.season || (a.league < b.league ? 1 : -1) || b.week - a.week);
  const built = LEAGUES.map(([lg]) => R[lg] && R[lg].built).filter(Boolean).sort().pop();
  const since = LEAGUES.map(([lg]) => R[lg] && R[lg].since).filter(Boolean).sort()[0];
  let h = `<div class="wrap">
<header class="top">
<h1>RECOMMENDED</h1>
<p class="lede">The picks this site stands behind. <strong>Every pick is published before kickoff and graded at the price shown.</strong> Rules are fixed before each season. Nothing is edited or removed afterward.</p>
</header>
<section aria-labelledby="where-h">
<h2 id="where-h">Where it stands</h2>
<p class="note">${nRec ? "" : "<strong>No track has earned “Recommended” yet.</strong> Every track starts on trial. The earliest one can be promoted is after the 2027 season, once it has 100 graded picks across a full season. "}${since ? "The record began " + esc(since) + "; nothing before that is counted." : "No picks have been published yet. The first appear with the next board update."}</p>
<div class="tiles">
${tile("Tracks recommended", nRec + " of " + tracks.length, tracks.filter((t) => t.status === "trial").length + " on trial" + (tracks.some((t) => t.status === "held") ? ", " + tracks.filter((t) => t.status === "held").length + " stopped" : ""))}
${tile("Rolling total, $10 a pick", all.graded ? money(all.dollars) : "$0.00", all.graded + " graded " + (all.graded === 1 ? "pick" : "picks") + (all.n - all.graded ? ", " + (all.n - all.graded) + " open" : ""))}
${tile("Live record, all tracks", all.graded ? wl(all) : "0-0", all.win == null ? "No graded picks yet" : pct(all.win) + " of decided picks")}
${tile("Return at the published price", all.roi == null ? "—" : spct(all.roi), all.se == null ? "one unit a pick" : "± " + (all.se * 100).toFixed(1) + "%, one unit a pick")}
${tile("Closing line value", all.clv == null ? "—" : spct(all.clv), all.cse == null ? "against the sharp close" : "± " + (all.cse * 100).toFixed(1) + "%, against the sharp close")}
</div>
</section>
<section aria-labelledby="week-h">
<h2 id="week-h">Open picks</h2>
<p class="note">Published and not yet graded. Book and price are the best of DraftKings, FanDuel and Kalshi when the pick was published; check the price before betting. Kalshi joined on Nov 26, 2026 and is shown at its price after the exchange’s fee; teasers and props are DraftKings and FanDuel only. Times are Eastern.</p>`;
  h += open.length ? `<div class="scroll"><table class="m-cards m-open">
<thead><tr><th class="l">Published</th><th class="l">Track</th><th class="l">Game</th><th class="l">Pick</th><th class="l">Book</th><th>Price</th><th class="l">Status</th></tr></thead><tbody>
${open.map((p) => `<tr><td class="l">${when(p.at)}</td><td class="l"><a href="${reportHref(p.league, p.season, p.week)}">${esc(trackName(p.league, p.track))}</a></td><td class="l">${game(p)}</td><td class="l"><strong>${esc(minus(p.pick))}</strong></td><td class="l">${BOOK[p.book] || esc(p.book)}</td><td>${price(p.odds)}</td><td class="l">${chip((tracks.find((t) => t.key === p.track) || {}).status || "trial")}</td></tr>`).join("\n")}
</tbody></table></div>${open.length > 10 ? `<p class="m-more"><button type="button" class="btn" onclick="this.parentElement.previousElementSibling.querySelector('table').classList.add('all'); this.parentElement.remove()">Show all ${open.length} open picks</button></p>` : ""}` : `<p class="note">Nothing open right now.</p>`;
  h += `</section>
<section aria-labelledby="tracks-h">
<h2 id="tracks-h">The tracks</h2>
<p class="note">One kind of pick, one fixed rule, one record. The live record counts only picks published here before kickoff. Backtests are kept apart in the last column and never added in.</p>
<div class="scroll"><table class="m-cards m-tracks">
<thead><tr><th class="l">Track</th><th class="l">Status</th><th>Live record</th><th>Win rate</th><th>$10 a pick</th><th>Return</th><th>Closing line value</th><th>Picks to 100</th><th class="l">Before going live (not part of the record)</th></tr></thead><tbody>
${tracks.map((t) => `<tr><td class="l t"><strong>${esc(t.name)}</strong><br><span style="color:var(--ink-2);font-size:12.5px">${esc(t.rule)}</span></td><td class="l">${chip(t.status)}</td><td>${t.w}-${t.l}${t.p ? "-" + t.p : ""}</td><td>${t.win_pct == null ? "" : pct(t.win_pct)}</td><td>${t.graded ? money(t.dollars) : ""}</td><td>${t.graded ? pm(t.roi, t.roi_se) : ""}</td><td>${t.clv == null ? "" : pm(t.clv, t.clv_se)}</td><td>${t.status === "held" ? "Stopped: no new picks" : t.to_go ? t.to_go : "0, needs a full season"}</td><td class="w">${esc(minus(t.before))}</td></tr>`).join("\n")}
</tbody></table></div>
</section>
<section aria-labelledby="weeks-h">
<h2 id="weeks-h">Week by week</h2>
<p class="note">Each week has its own report for each league: the picks as they were published, then the results. Every past week stays available as a page and a PDF. The running total is $10 on every pick, by league.</p>`;
  h += weeks.length ? `<div class="scroll"><table class="narrow m-cards m-weeks">
<thead><tr><th class="l">Week</th><th>Picks</th><th>Record</th><th>Week, $10 a pick</th><th>Running total</th><th>Closing line value</th><th class="l">PDF</th></tr></thead><tbody>
${weeks.map((w) => `<tr><td class="l"><a href="${reportHref(w.league, w.season, w.week)}" style="font-weight:600">${NAME[w.league]}, week ${w.week} report</a></td><td>${w.n}</td><td>${w.w}-${w.l}${w.p ? "-" + w.p : ""}</td><td>${w.graded ? money(w.dollars) : ""}</td><td>${money(w.running)}</td><td>${w.clv == null ? "" : spct(w.clv)}</td><td class="l"><a href="${pdfName(w.league, w.season, w.week)}">PDF</a></td></tr>`).join("\n")}
</tbody></table></div>` : `<p class="note">No weeks yet.</p>`;
  const every = ps.slice().sort((a, b) => a.kickoff < b.kickoff ? 1 : -1);
  let run = 0;
  const runBy = {};
  ps.filter((p) => !p.dup && ["W", "L", "P"].includes(p.result)).sort((a, b) => a.kickoff < b.kickoff ? -1 : a.kickoff > b.kickoff ? 1 : a.at < b.at ? -1 : 1)
    .forEach((p) => { run += p.dollars || 0; runBy[p.id] = run; });
  h += `<details><summary>Every pick ever published (${ps.length})</summary>
<div class="scroll"><table class="m-cards m-graded">
<thead><tr><th class="l">Published</th><th class="l">Week</th><th class="l">Track</th><th class="l">Game</th><th class="l">Pick</th><th class="l">Book</th><th>Price</th><th class="l">Result</th><th>$10</th><th>Rolling total</th></tr></thead><tbody>
${every.map((p) => `<tr><td class="l">${ETD.format(utc(p.at))}</td><td class="l">${NAME[p.league]} ${p.week}</td><td class="l">${esc(trackName(p.league, p.track))}</td><td class="l">${game(p)}</td><td class="l">${esc(minus(p.pick))}</td><td class="l">${BOOK[p.book] || esc(p.book)}</td><td>${price(p.odds)}</td><td class="l">${result(p)}</td><td>${p.dup ? "counted once" : money(p.dollars)}</td><td>${runBy[p.id] == null ? "" : money(runBy[p.id])}</td></tr>`).join("\n")}
</tbody></table></div>${every.length > 15 ? `<p class="m-more"><button type="button" class="btn" onclick="this.parentElement.previousElementSibling.querySelector('table').classList.add('all'); this.parentElement.remove()">Show all ${every.length} picks</button></p>` : ""}</details>
<div class="btns"><a class="btn" href="../../data/recommended/nfl_picks.csv">NFL pick file (CSV)</a><a class="btn" href="../../data/recommended/cfb_picks.csv">College pick file (CSV)</a></div>
</section>
<section aria-labelledby="rules-h">
<h2 id="rules-h">How the record is kept</h2>
<div class="rules">
<div><h3>Published before kickoff</h3><p>Each pick is written once, with the time, book, line and price. The file’s public history shows when.</p></div>
<div><h3>Graded at the published price</h3><p>One flat unit a pick, $10 in the rolling total. Each report also shows the pick at the closing line, for anyone betting late.</p></div>
<div><h3>Never edited or removed</h3><p>A pick that goes bad before kickoff still counts. Only a bet the book itself would void is void.</p></div>
<div><h3>Rules fixed for the season</h3><p>A rule change waits for the next season and starts a new line. The old record stays on the page.</p></div>
</div>
</section>
<section aria-labelledby="status-h">
<h2 id="status-h">What each status means</h2>
<div class="status">
<div><span class="k">${chip("trial")}</span><p>Published and graded in the open. Not yet a recommendation.</p></div>
<div><span class="k">${chip("recommended")}</span><p>100+ graded picks across a full season, return above zero by at least one standard error, closing line value not below zero. Rechecked the next season.</p></div>
<div><span class="k">${chip("proven")}</span><p>The same, with the return above zero by at least two standard errors.</p></div>
<div><span class="k">${chip("held")}</span><p>Stopped by hand because its rule did not hold up in testing. It publishes no new picks; the ones already published stay on the record and in the totals.</p></div>
<div><span class="k">${chip("paused")}</span><p>After 100+ picks the return or the closing line value is clearly below zero. Off the list until the next season’s review.</p></div>
</div>
</section>
<footer>${built ? "Updated " + ETD.format(utc(built)) + " ET. " : ""}For research and entertainment. Past results do not predict future results, and nothing here is betting advice.</footer>
</div>`;
  document.getElementById("app").innerHTML = h;
}

function reportPage(lg, season, week) {
  document.body.className = "report";
  document.title = `Recommended: ${NAME[lg]} week ${week} · Weekly Gridiron Board`;
  const D = R[lg] || {}, ps = picksOf(lg).map((p) => ({ ...p, league: lg }));
  const mine = ps.filter((p) => p.season === season && p.week === week);
  const wk = (D.weeks || []).find((w) => w.season === season && w.week === week);
  const before = (D.weeks || []).filter((w) => w.season < season || (w.season === season && w.week <= week)).pop();
  const weeksList = [...new Set(ps.filter((p) => p.season === season).map((p) => p.week))].sort((a, b) => a - b);
  if (!weeksList.includes(week)) weeksList.push(week);
  const r = rec(mine), openN = mine.filter((p) => !p.result && !p.dup).length;
  const col = (t) => t.key === "nfl_prop_under" ? "Player, market" : t.key === "nfl_wong_teaser" ? "Games" : "Game";
  const close = (p) => {
    if (p.close == null) return "";
    const line = p.market === "Spread" ? (p.close > 0 ? "+" : "") + p.close : String(p.close);
    return minus(line) + (p.close_units == null ? "" : ", " + (p.close_units > 0 ? "won" : p.close_units < 0 ? "lost" : "push") + " at −110");
  };
  let h = `<div class="doc">
<div class="controls">
<div class="btns">
${LEAGUES.map(([k, n]) => { const ws = [...new Set(picksOf(k).map((p) => p.season * 100 + p.week))].sort((a, b) => a - b); const last = ws.length ? ws[ws.length - 1] : season * 100 + week; return `<a class="btn" ${k === lg ? 'aria-current="page"' : ""} href="${reportHref(k, Math.floor(last / 100), last % 100)}">${n}</a>`; }).join("")}
<span class="s" style="font-size:12.5px;color:#333;margin-left:8px">Week</span>
${weeksList.map((w) => `<a class="btn" ${w === week ? 'aria-current="page"' : ""} href="${reportHref(lg, season, w)}">${w}</a>`).join("")}
</div>
<div class="btns"><a class="btn" href="#">Full record</a><a class="btn" href="${pdfName(lg, season, week)}">Download PDF</a><button class="btn" type="button" onclick="window.print()">Print</button></div>
</div>
<header>
<div class="kicker">Weekly Gridiron Board</div>
<h1>RECOMMENDED: ${NAME[lg].toUpperCase()} WEEK ${week}</h1>
<p class="s">${D.built ? "Updated " + ETD.format(utc(D.built)) + " ET. " : ""}${r.n} ${r.n === 1 ? "pick" : "picks"} published, ${r.graded} graded, ${openN} open. Each pick is added when it is published and is never changed afterward. The report is final after the week’s last game.</p>
</header>
<div class="tiles">
${tile("This week", r.graded ? wl(r) : "0-0", r.graded + " graded, " + openN + " open")}
${tile("This week, $10 a pick", r.graded ? money(r.dollars) : "$0.00", r.graded ? units(r.units) + " units" : "nothing graded yet")}
${tile("Rolling total, " + NAME[lg], before ? money(before.running) : "$0.00", "$10 on every pick through week " + week)}
${tile("Season record, " + NAME[lg], D.all && D.all.graded ? D.all.w + "-" + D.all.l + (D.all.p ? "-" + D.all.p : "") : "0-0", D.all && D.all.roi != null ? pm(D.all.roi, D.all.roi_se) + " return" : "no graded picks yet")}
</div>
<p class="box"><strong>${tracksOf(lg).every((t) => t.status === "trial" || t.status === "held") ? "All tracks are on trial." : "Each track’s status is shown beside it."}</strong> On-trial picks are published and graded in the open, but have not yet earned “Recommended”. Prices are the better of DraftKings and FanDuel at the time shown; check the price before betting.</p>`;
  for (const t of tracksOf(lg)) {
    const rows = mine.filter((p) => p.track === t.key).sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : a.kickoff < b.kickoff ? -1 : 1);
    if (t.status === "held" && !rows.length) continue;      // a stopped track shows only in the weeks it has picks
    h += `<section>
<div class="th"><h2>${esc(t.name)}</h2>${chip(t.status)}<span class="rec">Season so far: ${t.graded ? t.w + "-" + t.l + (t.p ? "-" + t.p : "") + ", " + money(t.dollars) : "no graded picks yet"}</span></div>
<p class="s">${esc(minus(t.rule))}</p>`;
    h += rows.length ? `<div class="scroll"><table>
<thead><tr><th>Published (ET)</th><th>${col(t)}</th><th>Pick</th><th>Book</th><th>Price</th><th>Result</th><th>$10</th><th>At the close</th></tr></thead><tbody>
${rows.map((p) => `<tr><td class="nw">${when(p.at)}</td><td>${game(p)}</td><td class="nw"><strong>${esc(minus(p.pick))}</strong></td><td>${BOOK[p.book] || esc(p.book)}</td><td class="nw">${price(p.odds)}</td><td>${result(p)}</td><td class="nw">${p.dup ? "counted once" : money(p.dollars)}</td><td>${close(p)}</td></tr>`).join("\n")}
</tbody></table></div>` : `<p class="s">Nothing met this track’s rule this week.</p>`;
    h += `</section>`;
  }
  h += `<footer>
<p>Dollars are at the published price, $10 risked on each pick. “At the close” is the sharp book’s line at kickoff and how the same side did there at −110, for anyone betting late. A bet that lands on two tracks is counted once in the totals. Teasers are graded at −120; check the price in the app.</p>
<p>Full record and rules: the Recommended page. For research and entertainment. Past results do not predict future results, and nothing here is betting advice.</p>
</footer>
</div>`;
  document.getElementById("app").innerHTML = h;
}

function route() {
  const m = /^#(nfl|cfb)\/(\d{4})\/(\d{1,2})$/.exec(location.hash);
  if (m) reportPage(m[1], +m[2], +m[3]); else recordPage();
  window.scrollTo(0, 0);
  document.documentElement.setAttribute("data-ready", "1");
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
